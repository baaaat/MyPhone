
name: Build MyPhone

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild MyPhone.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        run: msbuild MyPhone.sln /t:Build /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MyPhone-Windows-x64
          path: |
            **/AppPackages/**/*
            **/Packages/**/*
          if-no-files-found: error
